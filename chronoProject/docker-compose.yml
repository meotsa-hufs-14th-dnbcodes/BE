services:
    web:
        build:
            context: ..
        image: chrono-web
        container_name: web
        command: bash -c "gunicorn chronoProject.wsgi:application -b 0.0.0.0:8000"
        env_file:
            - .env
        ports:
            - '8000:8000'
        restart: always
        volumes:
            - ./static:/app/static
        networks:
            - server

    selfie:
        build:
            context: ../selfie_analysis
        image: selfie-web
        container_name: selfie
        command: bash -c "gunicorn selfie_analysis.wsgi:application -b 0.0.0.0:8001"
        env_file:
            - ../selfie_analysis/.env
        ports:
            - '8001:8001'
        restart: always
        networks: 
            - server

    nginx:
        image: nginx:latest
        container_name: nginx
        volumes:
            - ./nginx.default.conf:/etc/nginx/conf.d/default.conf
            - ./static:/static
            - ./cert/certbot/conf:/etc/letsencrypt
            - ./cert/certbot/www:/var/www/certbot
        restart: always
        ports:
            - '80:80'
            - '443:443'
        depends_on:
            - web
            - selfie
        networks:
            - server
        command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

    certbot:
        image: certbot/certbot
        volumes:
            - ./cert/certbot/conf:/etc/letsencrypt
            - ./cert/certbot/www:/var/www/certbot
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
    server:
      driver: bridge
