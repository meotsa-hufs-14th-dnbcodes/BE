server {
    listen 80;
    server_name nyam17.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP → HTTPS 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nyam17.site;

    ssl_certificate /etc/letsencrypt/live/nyam17.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nyam17.site/privkey.pem;

    # 토큰 검증 전용 내부 위치 (외부에서 직접 접근 불가)
    location = /internal/verify {
        internal;
        proxy_pass http://web:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # 마이페이지/로그인/시술 등 → 기존 web 서비스 (변경 없음)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 셀카분석 → 별도 서비스, 토큰 검증 통과해야만 접근 가능
    location /selfies {
        auth_request /internal/verify;
        auth_request_set $user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $user_id;

        proxy_pass http://selfie:8001;   # selfie_analysis 컨테이너(서비스명 selfie):포트 8001
        proxy_set_header Host $host;
    }

    location /static {
        alias /static;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}